[project]
name = "nyc-taxi-eda-05-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "requests==2.34.2",
    "scipy==1.18.0",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.2",
    "pytest==9.1.1",
]


[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_taxi_eda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
